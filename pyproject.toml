[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quilt-canon-game"
version = "0.1.0"
description = "Interactive browser game — walk the substrate, collect canon lore"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "SuperInstance", email = "[email protected]"}]
keywords = ["game", "browser", "canon", "quilt", "substrate-walker", "interactive"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.scripts]
quilt-canon-game = "quilt_canon_radio:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["quilt_canon_game*"]
